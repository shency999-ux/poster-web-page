<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名师精品授课视频 - 进群免费领</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(to bottom, #f0f7ff, #c9e4ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .poster-container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            background: linear-gradient(180deg, #FFFFFF 0%, #E6F3FF 100%);
        }

        .gradient-text {
            background: linear-gradient(to bottom, #e5b567, #b8860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .tag-pill {
            background: #000;
            color: #51f7d5;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tag-pill svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .qr-section {
            position: relative;
            padding: 20px;
            margin: 20px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,110,255,0.1);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .qr-section:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0,110,255,0.15);
        }

        .qr-section:active {
            transform: translateY(0);
        }

        .qr-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 16px;
        }

        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            color: #4A90E2;
        }

        /* 全屏放大弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            animation: slideUp 0.3s ease;
        }

        .modal-image {
            width: 100%;
            height: auto;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
        }

        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .modal-hint {
            color: white;
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            animation: fadeIn 0.5s ease 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* 移动端优化 */
        @media (max-width: 640px) {
            .modal-close {
                top: 10px;
                right: 10px;
            }

            .modal-hint {
                font-size: 12px;
            }
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="poster-container p-6 md:p-10 flex flex-col items-center text-center">
        <!-- Header Section -->
        <div class="w-full flex justify-between items-start mb-4">
            <h1 class="text-5xl md:text-6xl font-black italic text-gray-900 tracking-tighter">@30G</h1>
            <div class="bg-[#51f7d5] text-black px-4 py-2 rounded-xl font-bold text-lg leading-tight shadow-sm">
                名师精品<br>授课视频
            </div>
        </div>

        <h2 class="text-5xl md:text-6xl font-black italic gradient-text mb-8 tracking-wide">
            进群免费领
        </h2>

        <!-- Tags Grid -->
        <div class="grid grid-cols-2 gap-3 mb-10 w-full max-w-sm">
            <div class="tag-pill">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                房屋布局风水
            </div>
            <div class="tag-pill">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                公司店铺选址
            </div>
            <div class="tag-pill">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                看相识人秘术
            </div>
            <div class="tag-pill">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                财运桃花运势
            </div>
        </div>

        <!-- QR Code Container - Clickable -->
        <div class="relative w-full aspect-square max-w-[340px] mb-8 group" id="qrContainer">
            <div class="qr-section">
                <img src="poster.webp" alt="点击放大二维码" class="qr-image" id="qrImage">
                <!-- 提示文字 -->
                <div class="absolute bottom-4 left-4 right-4 text-center">
                    <p class="text-xs md:text-sm text-gray-600 bg-white bg-opacity-80 px-2 py-1 rounded">
                        👆 点击放大识别
                    </p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="w-full border-t border-blue-200 pt-6 mt-4">
            <p class="text-blue-600 font-bold text-lg md:text-xl tracking-wider">
                长按识别入群！
            </p>
        </div>
    </div>

    <!-- 全屏放大弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <img src="poster.webp" alt="二维码大图" class="modal-image" id="modalImage">
            <div class="modal-hint">
                📱 长按图片保存或截图，在微信中识别二维码加入群组
            </div>
        </div>
    </div>

    <script>
        const qrContainer = document.getElementById('qrContainer');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');
        const qrImage = document.getElementById('qrImage');

        // 点击二维码打开放大弹窗
        qrContainer.addEventListener('click', function(e) {
            // 防止冒泡
            if (e.target.closest('.modal-close')) return;
            modalOverlay.classList.add('active');
            // 禁止背景滚动
            document.body.style.overflow = 'hidden';
        });

        // 关闭弹窗
        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        modalClose.addEventListener('click', closeModal);

        // 点击背景关闭弹窗
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        // 按 ESC 键关闭弹窗
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });

        // 移动端优化：防止图片被长按时触发系统菜单
        qrImage.addEventListener('contextmenu', function(e) {
            // 允许长按，不阻止默认行为
        });
    </script>
</body>
</html>
